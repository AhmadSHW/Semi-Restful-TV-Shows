<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Edit {{show.title }}</title>
</head>
<body>
	<a href="/shows/{{ show.id }}/">Go to Show</a>
	<h1>Edit Show</h1>

	<form action="/shows/{{ show.id }}/update/" method="POST">
		{% csrf_token %}

		<label>Title:</label><br>
		<input type="text" name="title" value="{{ show.title }}"><br><br>

		<label>Network</label><br>
		<input type="text" name="network" value="{{ show.network }}"><br><br>

		<label>Release Date</label><br>
		<input type="date" name="release_date" value="{{ show.release_date|date:'Y-m-d' }}"><br><br>

		<label>Description</label><br>
		<textarea name="description">{{ show.description }}</textarea>

		<button type="submit">Update</button>
	</form>
	
</body>
</html>
